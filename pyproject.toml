[project]
name = "baseball-ops-intelligence"
version = "1.0.0"
description = "Full-stack baseball operations intelligence platform with player analytics, reports, workflows, and AI-style recommendations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Your Name" }
]
keywords = ["baseball", "analytics", "full-stack", "sqlite", "operations", "dashboard"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.ruff]
line-length = 120
target-version = "py310"

